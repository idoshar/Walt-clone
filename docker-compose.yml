services:
  ex2-server:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "${EX2_SERVER_PORT:-8080}"
    command: ["./todo_server", "${EX2_SERVER_PORT:-8080}"]
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: "${MONGODB_DB_NAME:-food_delivery}"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web-server:
    build:
      context: .
      dockerfile: Dockerfile.webserver
    ports:
      - "${WEB_SERVER_HOST_PORT:-3000}:${WEB_SERVER_PORT:-3000}"
    environment:
      PORT: "${WEB_SERVER_PORT:-3000}"
      EX2_HOST: "${EX2_HOST:-ex2-server}"
      EX2_PORT: "${EX2_SERVER_PORT:-8080}"
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:3000/api}"
      MONGODB_URI: "${MONGODB_URI:-mongodb://mongo:27017/food_delivery}"
      MONGODB_DB_NAME: "${MONGODB_DB_NAME:-food_delivery}"
    depends_on:
      ex2-server:
        condition: service_started
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
