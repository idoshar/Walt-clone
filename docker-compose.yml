services:
  ex2-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ex2-server
    command: ["./todo_server", "8080"]
    expose:
      - "8080"
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  web-server:
    build:
      context: .
      dockerfile: Dockerfile.webserver
    container_name: web-server
    depends_on:
      ex2-server:
        condition: service_started
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      EX2_HOST: ex2-server
      EX2_PORT: 8080
      VITE_API_BASE_URL: http://localhost:3000/api
      MONGODB_URI: mongodb://mongo:27017/food_delivery
      MONGODB_DB_NAME: food_delivery
    restart: unless-stopped

volumes:
  mongo-data:

